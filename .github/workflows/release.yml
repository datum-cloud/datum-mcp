name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Publishing the Homebrew formula to datum-cloud/homebrew-tap needs a
      # token with write access to THAT repo too, which the default
      # GITHUB_TOKEN (scoped to this repo only) can't provide. Until a
      # GitHub App with access to both repos is installed and these two
      # secrets are set, this is skipped and the release still runs (without
      # publishing to Homebrew) using the default token instead.
      #
      # `secrets` can't be referenced directly in a step's `if:` condition,
      # so the presence check happens here (a run step can still interpolate
      # secrets into its script) and later steps branch on this step's
      # output instead.
      - name: Check for release bot secrets
        id: check-secrets
        run: |
          if [ -n "${{ secrets.RELEASE_BOT_APP_ID }}" ]; then
            echo "has_app_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app_secrets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate GitHub App token
        id: app-token
        if: steps.check-secrets.outputs.has_app_secrets == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          repositories: datum-mcp,homebrew-tap

      - name: Determine goreleaser flags
        id: flags
        run: |
          if [ "${{ steps.check-secrets.outputs.has_app_secrets }}" = "true" ]; then
            echo "extra_args=" >> "$GITHUB_OUTPUT"
          else
            echo "extra_args=--skip=homebrew" >> "$GITHUB_OUTPUT"
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean ${{ steps.flags.outputs.extra_args }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
